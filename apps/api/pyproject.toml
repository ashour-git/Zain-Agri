[project]
name = "zain-agri-api"
version = "0.1.0"
description = "ZAIN AGRI — backend API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.118",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.37",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "S", "C4", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
